name: Release

# Keeps a release PR open with the next version (from the conventional commits since the last release) and
# CHANGELOG.md. Merging that PR tags the release and creates the GitHub release; Amplify deploys it like any merge.
# GitHub holds CI on PRs opened by github-actions[bot] until a maintainer approves the run on the PR (ADR 0008).
on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
